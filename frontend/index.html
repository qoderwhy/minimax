<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="后台管理系统" />
    <meta name="theme-color" content="#409eff" />
    <title>后台管理系统</title>
    <script>
      /* 在样式与脚本加载前应用已保存的主题，避免首屏先渲染默认主题再切换造成闪烁 */
      ;(function () {
        var root = document.documentElement
        var saved = {}
        try {
          saved = JSON.parse(localStorage.getItem('qkit-theme') || '{}')
        } catch (e) {
          saved = {}
        }
        root.setAttribute('data-theme', saved.color || 'blue')
        if (saved.dark) root.classList.add('dark')
      })()
    </script>
    <style>
      /* 首屏占位：主包下载解析期间显示加载指示，避免长时间白屏
         （Vue 挂载时会清空 #app 内容，无需手动移除） */
      html,
      html.dark {
        background: #141414;
      }

      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f7fa;
      }

      html.dark #app-loading {
        background: #141414;
      }

      #app-loading .ring {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(64, 158, 255, 0.25);
        border-top-color: #409eff;
        border-radius: 50%;
        animation: app-loading-spin 0.8s linear infinite;
      }

      @keyframes app-loading-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="app-loading"><div class="ring"></div></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

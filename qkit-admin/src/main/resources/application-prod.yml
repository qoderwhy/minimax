spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${SPRING_REDIS_HOST}
      port: ${SPRING_REDIS_PORT:6379}
      database: ${SPRING_REDIS_DB:0}
      password: ${SPRING_REDIS_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration

sa-token:
  token-name: satoken
  timeout: ${SA_TOKEN_TIMEOUT:86400}
  jwt-secret-key: ${SA_JWT_SECRET}

logging:
  level:
    com.qkit: info

# 生产环境关闭接口文档，避免接口与权限码对外暴露
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

knife4j:
  enable: false

# actuator 仅暴露健康检查且不展示细节
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  security:
    # 可信反向代理地址（精确 IP / IPv4 前缀 / IPv4 CIDR），逗号分隔。
    # docker 自定义网络地址默认取自 172.16.0.0/12 地址池；置空表示不信任任何代理（此时客户端 IP 取直连地址）。
    trusted-proxies: "${TRUSTED_PROXIES:172.16.0.0/12,127.0.0.1,::1}"

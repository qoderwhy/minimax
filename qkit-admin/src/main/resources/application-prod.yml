spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PWD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}
      password: ${REDIS_PWD}
  flyway:
    enabled: true
    locations: classpath:db/migration

sa-token:
  token-name: satoken
  timeout: ${SA_TOKEN_TIMEOUT:86400}
  jwt-secret-key: ${SA_JWT_SECRET}

logging:
  level:
    com.qkit: info
  file:
    name: /var/log/qkit/app.log
